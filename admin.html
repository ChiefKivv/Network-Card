<!DOCTYPE html>
<html lang="en">
<<link rel="icon" type="image/png" href="./assets/favicon.png">
<link rel="apple-touch-icon" href="./assets/favicon.png">>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/png" href="assets/favicon.png">
<title>Chief Kivv Admin</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="admin site">
  <header class="admin-head">
    <div><h1>CHIEF KIVV</h1><p>Admin Dashboard</p></div>
    <button id="logout" class="small-btn" hidden>LOG OUT</button>
  </header>

  <section id="loginPanel" class="panel">
    <h2>ADMIN LOGIN</h2>
    <form id="loginForm">
      <label>Email<input id="loginEmail" type="email" value="doublecupbookings@gmail.com" required></label>
      <label>Password<input id="loginPassword" type="password" required></label>
      <button class="submit">SIGN IN</button>
      <p id="loginStatus" class="status"></p>
    </form>
  </section>

  <div id="dashboard" hidden>
    <section class="panel">
      <h2>UPLOAD A MIX</h2>
      <form id="mixForm">
        <label>Mix Name*<input id="mixName" maxlength="150" placeholder="Summer Soca Session" required></label>
        <label>Mix Source*
          <select id="mixSource">
            <option value="upload">Upload MP3 / AIF / AIFF</option>
            <option value="soundcloud">SoundCloud Link</option>
          </select>
        </label>
        <label id="mixFileLabel">Audio File*<input id="mixFile" type="file" accept="audio/mpeg,audio/aiff,audio/x-aiff,.mp3,.aif,.aiff"></label>
        <label id="soundcloudUrlLabel" hidden>SoundCloud Track URL*<input id="soundcloudUrl" type="url" maxlength="1000" placeholder="https://soundcloud.com/artist/mix-name"></label>
        <p class="muted">Direct uploads: MP3, AIF or AIFF up to 2 GB. Large files use resumable upload.</p>
        <label class="check"><input id="isLatest" type="checkbox"> Set as Latest Mix</label>
        <button class="submit">ADD MIX</button>
        <p id="mixStatus" class="status"></p>
      </form>
    </section>

    <section class="panel">
      <h2>MIX LIBRARY</h2>
      <div id="adminMixes">Loading…</div>
    </section>

    <section class="panel">
      <h2>BOOKING REQUESTS</h2>
      <div id="bookings">Loading…</div>
    </section>
  </div>
</main>
<script type="module" src="admin.js"></script>
</body>
</html>
