<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <link
    rel="icon"
    type="image/png"
    href="./assets/favicon.png"
  >

  <link
    rel="apple-touch-icon"
    href="./assets/favicon.png"
  >

  <title>Chief Kivv Admin</title>

  <link
    rel="stylesheet"
    href="styles.css"
  >
</head>


<body>

<main class="admin site">


  <!-- =====================================================
       ADMIN HEADER
  ====================================================== -->

  <header class="admin-head">

    <div>

      <h1>
        CHIEF KIVV
      </h1>

      <p>
        Admin Dashboard
      </p>

    </div>


    <button
      id="logout"
      class="small-btn"
      type="button"
      hidden
    >
      LOG OUT
    </button>

  </header>



  <!-- =====================================================
       ADMIN LOGIN
  ====================================================== -->

  <section
    id="loginPanel"
    class="panel"
  >

    <h2>
      ADMIN LOGIN
    </h2>


    <form id="loginForm">


      <label>

        Email

        <input
          id="loginEmail"
          type="email"
          value="doublecupbookings@gmail.com"
          autocomplete="username"
          required
        >

      </label>


      <label>

        Password

        <input
          id="loginPassword"
          type="password"
          autocomplete="current-password"
          required
        >

      </label>


      <button
        class="submit"
        type="submit"
      >
        SIGN IN
      </button>


      <p
        id="loginStatus"
        class="status"
      ></p>


    </form>

  </section>



  <!-- =====================================================
       ADMIN DASHBOARD
  ====================================================== -->

  <div
    id="dashboard"
    hidden
  >


    <!-- =================================================
         UPLOAD / ADD MIX
    ================================================== -->

    <section class="panel">

      <h2>
        UPLOAD A MIX
      </h2>


      <form id="mixForm">


        <!-- MIX NAME -->

        <label>

          Mix Name*

          <input
            id="mixName"
            type="text"
            maxlength="150"
            placeholder="Summer Soca Session"
            required
          >

        </label>



        <!-- MIX SOURCE -->

        <label>

          Mix Source*

          <select
            id="mixSource"
            required
          >

            <option value="upload">
              Upload MP3 / AIF / AIFF
            </option>

            <option value="soundcloud">
              SoundCloud Link
            </option>

          </select>

        </label>



        <!-- DIRECT AUDIO UPLOAD -->

        <label id="mixFileLabel">

          Audio File*

          <input
            id="mixFile"
            type="file"
            accept="audio/mpeg,audio/aiff,audio/x-aiff,.mp3,.aif,.aiff"
          >

        </label>



        <!-- SOUNDCLOUD -->

        <label
          id="soundcloudUrlLabel"
          hidden
        >

          SoundCloud Link*

          <input
            id="soundcloudUrl"
            type="url"
            maxlength="1000"
            placeholder="Paste any SoundCloud link"
            inputmode="url"
            autocomplete="off"
          >

        </label>



        <!-- UPLOAD INFORMATION -->

        <p
          id="uploadHelp"
          class="muted"
        >
          Direct uploads: MP3, AIF or AIFF up to 2 GB.
          Large files use resumable upload.
        </p>



        <!-- LATEST MIX -->

        <label class="check">

          <input
            id="isLatest"
            type="checkbox"
          >

          Set as Latest Mix

        </label>



        <!-- SUBMIT -->

        <button
          class="submit"
          type="submit"
        >
          ADD MIX
        </button>



        <!-- MIX STATUS / ERRORS -->

        <p
          id="mixStatus"
          class="status"
          aria-live="polite"
        ></p>


      </form>

    </section>



    <!-- =================================================
         MIX LIBRARY
    ================================================== -->

    <section class="panel">

      <h2>
        MIX LIBRARY
      </h2>


      <div id="adminMixes">
        Loading…
      </div>

    </section>



    <!-- =================================================
         BOOKING REQUESTS
    ================================================== -->

    <section class="panel">

      <h2>
        BOOKING REQUESTS
      </h2>


      <div id="bookings">
        Loading…
      </div>

    </section>


  </div>

</main>



<!-- =====================================================
     ADMIN JAVASCRIPT

     ?v=4 forces browsers to retrieve the newest version
     instead of using an older cached admin.js.
===================================================== -->

<script
  type="module"
  src="./admin.js?v=4"
></script>


</body>

</html>
